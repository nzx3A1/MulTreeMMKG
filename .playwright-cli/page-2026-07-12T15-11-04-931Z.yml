          - generic [ref=e46]: "鄂尔多斯盆地位于华北克拉通( NCC) 西部，现今构造格局可划分为6个单元：伊盟隆起、西缘逆冲带 天环坳陷 伊陕斜坡 晋西挠褶带及渭北隆起( 杨华等，2000; 何登发，2022; 赵凡凡等，2025) 盆地周缘受控于新生代地堑系，北接阴山造山带，南邻秦岭造山带，东抵吕梁山构造带，西缘为贺兰－六盘山逆冲带，形成典型的盆－山耦合体系。 该盆地发育于太古宙－古元古代结晶基底之上，属大型多旋回叠合盆地( 何登发，2022; 赵凡凡等，2025) ，其沉积演化序列包含五大阶段: 中－新元古代裂陷槽期、早古生代浅水台地期、晚古生代近海平原期、中生代内陆湖盆期及新生代周缘断陷期( 何登发，2022; 刘国庆等，2024) 盆地内构造较为简单，以水平－缓西倾( 小于 3°) 的单斜为特征，但盆地边缘有较为复杂不同走向 不同样式的构造带发育，造山作用强烈，活动类型不均一，形成了不同的盆山耦合系统( Linet al． ，2016) 。"
