        - button "CHUNK 0:text:1 03 1．80～1． 75 Ga 是华北克拉通伸展作用的起始年代，这个阶段与南缘熊耳群火山岩及五台 恒山地区的基性岩墙群密切相关，期间岩浆活动记录了克拉通早期减薄和陆内伸展的地质过程。前人对这些岩浆事件进行了大量研究，认为这一时期的构造活动是 Columbia 超大陆裂解的初始( 陆松年等，2002;翟明 国 等，2014; 相 振 群，2014; Huang et al． ，2020) ，但对华北克拉通西南缘的研究仍有些薄弱( 赵太平等，2001，2004; 彭澎等，2004; 徐欢等，2020; 相振群等，2020; 李秋根等，2024) ，对地质事件的性质和构造背景的认识尚存在争议，如 Zhao 等( 2009) 根据火山岩地球化学特点，认为南缘的熊耳群火山岩具有钙碱性特点，形成于大陆边缘弧环境，而翟明国( 2004) 赵太平等( 2004) 姜盛洪( 2015)等认为其形成于与地幔柱相关的大陆裂解环境，Zhao 等( 2018) 相振群等( 2020) 认为南缘登封地区石秤花岗闪长岩是碰撞后形成的 因此，查明华北克拉通西南缘1．8 ～ 1．6 Ga 的构造事件性质及其动力学机制，对于探究华北克拉通的构造环境转变及其与哥伦比亚超大陆裂解的关系有着重要的意义。 ● 10 实体 ⌁ 4 关系 ◆ 8 事件" [ref=e51] [cursor=pointer]:
          - generic [ref=e52]:
            - generic [ref=e53]: CHUNK 0:text:1
            - generic [ref=e54]: "03"
