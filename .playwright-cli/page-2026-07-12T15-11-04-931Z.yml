        - button "CHUNK 1:text:1 04 研究区位于鄂尔多斯盆地西南缘六盘山地区( 图1a) 研究区内断裂发育，以脆性断裂为主，呈NW-NWW 向展布，主要为逆断层。 断面上局部可见近水平擦痕构造，反映其具有复杂的演化历史。 该期断裂主要活动时期为燕山-喜山期，新近纪以来新构造断裂特征比较明显。 研究区六盘山断裂带西部陇县骑安沟地区出露中酸性火成岩( 图 1b) ，本文花岗斑岩样品( LTX-1LTX-2) 采样点坐标为 N35°3． 674' E106°34． 540'，玄武 安 山 岩 ( LTX-3 LTX-4 ) 采 样 点 坐 标 为N35°2． 986' E106°35． 058' 由于受第四系覆盖层影响，两种岩体之间的接触关系在野外未能准确观测，但火成岩体与围岩下白垩统紫红色砂岩、泥岩及震旦系碳酸盐岩均呈断层接触，推测其为断层接触而不是侵入关系 花岗斑岩主要以岩墙形式分布( 图2a) ，玄武安山岩主要以岩株形式产出，表面风化较为严重，区域呈带状展布，部分岩体断面出露较 新鲜。 ● 12 实体 ⌁ 4 关系 ◆ 4 事件" [ref=e60] [cursor=pointer]:
