        - button "CHUNK 0:text:0 01 作为形成于3．8 Ga 的古老陆核，华北克拉通经历了多阶段多期次的构造演化( Wu and Zhong，1998; 翟明国等，2014) 前人研究认为，华北克拉通基底于约2．5 Ga 由多个微陆块拼合形成，可划分为胶辽 前淮 许昌 阜平 济宁和阿拉善地块 6 个地块 ( Zhai et al． ，2005; Zhai and Santosh，2011 )2．25～2． 0 Ga 期间，其西北部 中部及东北－东部发育3 条主裂谷带，裂谷盆地进一步演化为洋盆并启动俯冲过程( Santosh，2010; Zhai and Santosh，2011;翟明国等，2021) 历经长期俯冲－增生作用后，克拉通于 1． 97～1． 82 Ga 通过陆块碰撞完成最终克拉通化，形成孔兹岩带( 北部) 中央造山带( 中部) 及胶－辽－吉带( 东部) 3 条主缝合带( Zhai and Peng，2007; Santosh et al． ，2011; 刘 建 辉 等，2025 )1．80 Ga 时期华北克拉通进入伸展构造环境，伴随区域性伸展作用，克拉通内发育多组陆内裂谷系统基性岩墙群及非造山岩浆活动产物( 李江海等，2001; 翟明国，2004; 陈杰等，2024) ● 11 实体 ⌁ 9 关系 ◆ 4 事件" [ref=e33] [cursor=pointer]:
